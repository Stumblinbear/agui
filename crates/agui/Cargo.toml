[package]
name = "agui"
version = "0.3.0"
edition = "2024"
resolver = "2"
description = "A reactive GUI project"
homepage = "https://github.com/Stumblinbear/agui"
repository = "https://github.com/Stumblinbear/agui"
keywords = ["gui", "graphics"]
categories = ["gui", "graphics", "rendering"]
license = "MIT OR Apache-2.0"
readme = "../../README.md"

[features]
# A backend targeting a GPU texture, via `wgpu`. On Windows it also pulls the DirectComposition
# compositor (`dcomp`), which presents through `windows`.
gpu = ["dep:wgpu", "dep:windows"]
# A backend producing a pixel buffer on the CPU.
cpu = []

[dependencies]
agui_core.workspace = true

accesskit.workspace = true
bon.workspace = true
parley.workspace = true
peniko.workspace = true
raw-window-handle.workspace = true
rustc-hash.workspace = true
slotmap.workspace = true
smallbox.workspace = true
thiserror.workspace = true
tracing.workspace = true
typed_floats.workspace = true

wgpu = { workspace = true, optional = true }

# Integration tests drive full frames through the harness and observe layout with its probes. It depends on
# `agui`, so this edge is a cycle; keeping it dev-only (and the tests external in `tests/`) means both link the
# one `agui` lib, where an in-source `#[cfg(test)]` test would instead see a second, `cfg(test)` copy.
[dev-dependencies]
agui_test = { path = "../agui_test" }

# The DirectComposition compositor is Windows-only; its deps stay off every other target so a
# non-Windows `gpu` build pulls only `wgpu`.
[target.'cfg(windows)'.dependencies]
# Pinned to the `windows` version wgpu-hal links, so the raw D3D12 objects pulled out of wgpu are the
# same types DirectComposition and DXGI expect.
windows = { version = "0.58", optional = true, features = [
    "Foundation",
    "Foundation_Numerics",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_DirectComposition",
    "Win32_System_Com",
    "Win32_System_Threading",
] }
