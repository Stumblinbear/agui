[package]
name = "agui_winit"
version = "0.1.0"
edition = "2024"
resolver = "2"
description = "winit windowing and event loop for Agui"
homepage = "https://github.com/Stumblinbear/agui"
repository = "https://github.com/Stumblinbear/agui"
keywords = ["gui", "graphics", "winit"]
categories = ["gui", "graphics", "rendering"]
license = "MIT OR Apache-2.0"

[dependencies]
agui_render.workspace = true
async-executor.workspace = true
tracing.workspace = true
winit.workspace = true

[dev-dependencies]
agui_primitives.workspace = true
agui_render = { workspace = true, features = ["gpu"] }
agui_vello.workspace = true
tracing-subscriber.workspace = true
typed_floats.workspace = true

[[example]]
name = "hello_world"
path = "examples/hello_world.rs"
